---
# 種別: 統合サービス設定（時刻同期）
# 対象: Hyper-Vホスト（WinRM）。全VMで Time Synchronization 統合サービスを有効化し、
#       Hyper-Vホストの時刻にゲストを同期させる。
# 冪等性: Get-VMIntegrationService の Enabled を取得し、無効の場合のみ Enable-VMIntegrationService。
# モジュール: microsoft.hyperv に統合サービス管理モジュールが無いため win_shell で実装し、
#            when ガード＋changed_when で冪等化する。
# 変数: VAR_vm（全VM対象）。

- name: 現在の時刻同期統合サービス状態を取得する（before）
  ansible.windows.win_shell: |
    (Get-VMIntegrationService -VMName '{{ item.name }}' -Name 'Time Synchronization').Enabled
  loop: "{{ VAR_vm }}"
  loop_control:
    label: "{{ item.name }}"
  register: ts_before
  changed_when: false

- name: 時刻同期統合サービスを有効化する（無効の場合のみ）
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    Enable-VMIntegrationService -VMName '{{ item.name }}' -Name 'Time Synchronization'
    'CHANGED'
  when: (ts_before.results[idx].stdout | trim | lower) != 'true'
  loop: "{{ VAR_vm }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: idx
  changed_when: "'CHANGED' in stdout"

- name: 設定後の時刻同期統合サービス状態を取得する（after）
  ansible.windows.win_shell: |
    (Get-VMIntegrationService -VMName '{{ item.name }}' -Name 'Time Synchronization').Enabled
  loop: "{{ VAR_vm }}"
  loop_control:
    label: "{{ item.name }}"
  register: ts_after
  changed_when: false

- name: 時刻同期が有効であることを検証する
  ansible.builtin.assert:
    that:
      - (ts_after.results[idx].stdout | trim | lower) == 'true'
    fail_msg: "時刻同期の有効化に失敗しました: {{ item.name }}"
    success_msg: "時刻同期=有効: {{ item.name }}"
    quiet: true
  loop: "{{ VAR_vm }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: idx

- name: 時刻同期設定の前後差分をエビデンス出力する
  ansible.builtin.debug:
    msg:
      - "vm     : {{ item.name }}"
      - "before : {{ ts_before.results[idx].stdout | trim }}"
      - "after  : {{ ts_after.results[idx].stdout | trim }}"
  loop: "{{ VAR_vm }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: idx
