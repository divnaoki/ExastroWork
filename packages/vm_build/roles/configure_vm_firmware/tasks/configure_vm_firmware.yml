---
# 種別: ハードウェア構成（Gen2 ブート設定／セキュアブート）
# 対象: Hyper-Vホスト（WinRM）。VMは停止中に設定。Generation 2 前提。
# モジュール: microsoft.hyperv.hv_vm_boot（冪等。Gen2では secure_boot / secure_boot_template）。
#   item.secure_boot（on / off / rhel）を以下にマッピング:
#     on   -> secure_boot: true,  template: MicrosoftWindows
#     off  -> secure_boot: false（templateは指定しない）
#     rhel -> secure_boot: true,  template: MicrosoftUEFICertificateAuthority
# 前後取得: before は read-only(win_shell)、after はモジュール登録結果(secure_boot/template, changed)。
# 変数: VAR_vm。item.secure_boot。

- name: 現在のセキュアブート設定を取得する（before）
  ansible.windows.win_shell: |
    $f = Get-VMFirmware -VMName '{{ item.name }}'
    "{0};{1}" -f $f.SecureBoot, $f.SecureBootTemplate
  loop: "{{ VAR_vm }}"
  loop_control:
    label: "{{ item.name }}"
  register: fw_before
  changed_when: false

- name: ブート（セキュアブート）を設定する（冪等モジュール hv_vm_boot）
  microsoft.hyperv.hv_vm_boot:
    name: "{{ item.name }}"
    secure_boot: "{{ item.secure_boot != 'off' }}"
    secure_boot_template: >-
      {{ 'MicrosoftUEFICertificateAuthority' if item.secure_boot == 'rhel'
         else ('MicrosoftWindows' if item.secure_boot == 'on' else omit) }}
  loop: "{{ VAR_vm }}"
  loop_control:
    label: "{{ item.name }}"
  register: boot_result

- name: ブート設定の前後差分をエビデンス出力する
  ansible.builtin.debug:
    msg:
      - "vm          : {{ item.name }}"
      - "secure_boot : {{ item.secure_boot }}"
      - "before      : {{ fw_before.results[idx].stdout | trim }}"
      - "after       : secure_boot={{ boot_result.results[idx].secure_boot | default('-') }} template={{ boot_result.results[idx].secure_boot_template | default('-') }} (changed={{ boot_result.results[idx].changed }})"
  loop: "{{ VAR_vm }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: idx
