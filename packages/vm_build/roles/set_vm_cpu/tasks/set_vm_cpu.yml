---
# 種別: ハードウェア構成（vCPU数）
# 対象: Hyper-Vホスト（WinRM）。VMは停止中（起動前）に設定。
# 冪等性: 現在のProcessorCountを取得し、要求値と異なる場合のみ Set-VMProcessor。
# 変数: VAR_vm（複数具体値変数）。item.cpu_count を設定。

- name: 現在のvCPU数を取得する（before）
  ansible.windows.win_shell: "(Get-VM -Name '{{ item.name }}').ProcessorCount"
  loop: "{{ VAR_vm }}"
  loop_control:
    label: "{{ item.name }}"
  register: cpu_before
  changed_when: false

- name: vCPU数を設定する（現値と異なる場合のみ）
  ansible.windows.win_shell: |
    Set-VMProcessor -VMName '{{ item.name }}' -Count {{ item.cpu_count }}
    'CHANGED'
  when: (cpu_before.results[idx].stdout | trim | int) != (item.cpu_count | int)
  loop: "{{ VAR_vm }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: idx
  changed_when: "'CHANGED' in stdout"

- name: 設定後のvCPU数を取得する（after）
  ansible.windows.win_shell: "(Get-VM -Name '{{ item.name }}').ProcessorCount"
  loop: "{{ VAR_vm }}"
  loop_control:
    label: "{{ item.name }}"
  register: cpu_after
  changed_when: false

- name: vCPU数が要求値に一致することを検証する
  ansible.builtin.assert:
    that:
      - (cpu_after.results[idx].stdout | trim | int) == (item.cpu_count | int)
    fail_msg: "vCPU設定に失敗しました: {{ item.name }}"
    success_msg: "vCPU数={{ item.cpu_count }}: {{ item.name }}"
    quiet: true
  loop: "{{ VAR_vm }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: idx

- name: vCPU設定の前後差分をエビデンス出力する
  ansible.builtin.debug:
    msg:
      - "vm     : {{ item.name }}"
      - "before : {{ cpu_before.results[idx].stdout | trim }}"
      - "after  : {{ cpu_after.results[idx].stdout | trim }}"
  loop: "{{ VAR_vm }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: idx
