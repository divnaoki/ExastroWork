---
# 種別: ハードウェア構成（仮想スイッチ接続・VLAN）
# 対象: Hyper-Vホスト（WinRM）。VMは停止中に設定。
# モジュール: microsoft.hyperv.hv_network_adapter（冪等。switch_name / vlan_mode / vlan_id）。
# 前後取得: before は read-only(win_shell)、after はモジュール登録結果(changed)で確認。
# 変数: VAR_vm。item.switch_name / item.vlan_id（任意）。

- name: 現在の接続先仮想スイッチを取得する（before）
  ansible.windows.win_shell: |
    $a = Get-VMNetworkAdapter -VMName '{{ item.name }}' | Select-Object -First 1
    if ($a.SwitchName) { $a.SwitchName } else { 'NONE' }
  loop: "{{ VAR_vm }}"
  loop_control:
    label: "{{ item.name }}"
  register: net_before
  changed_when: false

- name: 仮想スイッチに接続する（VLAN指定含む・冪等モジュール hv_network_adapter）
  microsoft.hyperv.hv_network_adapter:
    vm_name: "{{ item.name }}"
    state: present
    switch_name: "{{ item.switch_name }}"
    vlan_mode: "{{ 'Access' if (item.vlan_id is defined and (item.vlan_id | string | trim) | length > 0) else omit }}"
    vlan_id: "{{ item.vlan_id if (item.vlan_id is defined and (item.vlan_id | string | trim) | length > 0) else omit }}"
  loop: "{{ VAR_vm }}"
  loop_control:
    label: "{{ item.name }}"
  register: net_result

- name: ネットワーク設定の前後差分をエビデンス出力する
  ansible.builtin.debug:
    msg:
      - "vm     : {{ item.name }}"
      - "before : {{ net_before.results[idx].stdout | trim }}"
      - "after  : switch={{ item.switch_name }} vlan={{ item.vlan_id | default('-') }} (changed={{ net_result.results[idx].changed }})"
  loop: "{{ VAR_vm }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: idx
